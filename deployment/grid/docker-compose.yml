version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: grid-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ransomguard_grid}
      MYSQL_USER: ${MYSQL_USER:-grid}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    networks:
      - grid_internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: grid-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?required} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - grid_internal
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  grid-api:
    build:
      context: ../..
      dockerfile: deployment/grid/Dockerfile
    # Explicit image name so a failed deployment can be rolled back to the
    # previous digest deterministically (see deploy.sh).
    image: ransomguard/grid-api:${GRID_IMAGE_TAG:-local}
    container_name: grid-api
    restart: unless-stopped
    environment:
      GRID_DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-grid}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-ransomguard_grid}
      GRID_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      GRID_JWT_SECRET_KEY: ${GRID_JWT_SECRET_KEY:?required}
      GRID_ENVIRONMENT: ${GRID_ENVIRONMENT:-production}
      GRID_LOG_LEVEL: ${GRID_LOG_LEVEL:-INFO}
      GRID_THREAT_INTEL_SIGNING_KEY_PATH: /etc/ransomguard-grid/pki/threat-intel-ed25519.key
      GRID_THREAT_INTEL_PACKAGES_DIR: /var/lib/ransomguard-grid/threat-intel-packages
      GRID_ALIENVAULT_OTX_API_KEY: ${GRID_ALIENVAULT_OTX_API_KEY:-}
      GRID_SMTP_ENABLED: ${GRID_SMTP_ENABLED:-false}
      GRID_SMTP_HOST: ${GRID_SMTP_HOST:-in-v3.mailjet.com}
      GRID_SMTP_PORT: ${GRID_SMTP_PORT:-587}
      GRID_SMTP_USERNAME: ${GRID_SMTP_USERNAME:-}
      GRID_SMTP_PASSWORD: ${GRID_SMTP_PASSWORD:-}
      GRID_SMTP_FROM_EMAIL: ${GRID_SMTP_FROM_EMAIL:-noreply@ransomguard.local}
      GRID_SMTP_FROM_NAME: ${GRID_SMTP_FROM_NAME:-RansomGuard-CM}
      GRID_AGENT_DISCONNECT_TIMEOUT_MINUTES: ${GRID_AGENT_DISCONNECT_TIMEOUT_MINUTES:-5}
    volumes:
      - ./pki:/etc/ransomguard-grid/pki:ro
      - threat_intel_packages:/var/lib/ransomguard-grid/threat-intel-packages
    networks:
      - grid_internal
      - grid_public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/api/v1/health'); exit(0 if r.status_code==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    container_name: grid-nginx
    restart: unless-stopped
    ports:
      # BIND_ADDR pins published ports to a single interface (the Tailscale IP in
      # production). Docker publishes through its own iptables chain and bypasses
      # UFW entirely, so binding the address is the only reliable way to keep the
      # LAN from reaching the stack. Defaults to 0.0.0.0 for local development.
      - "${BIND_ADDR:-0.0.0.0}:${NGINX_HTTPS_PORT:-443}:443"
      - "${BIND_ADDR:-0.0.0.0}:${NGINX_DASHBOARD_PORT:-8443}:8443"
      - "${BIND_ADDR:-0.0.0.0}:${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Internal PKI — agent mTLS channel (:443). Never replaced by a public CA:
      # agents authenticate with client certificates signed by this CA.
      - ./pki/server-fullchain.crt:/etc/nginx/ssl/server.crt:ro
      - ./pki/server.key:/etc/nginx/ssl/server.key:ro
      - ./pki/ca.crt:/etc/nginx/ssl/ca.crt:ro
      - ./pki/dhparam.pem:/etc/nginx/ssl/dhparam.pem:ro
      # Browser-facing certificate for the dashboard (:8443). In production this
      # directory holds the Let's Encrypt chain issued by `tailscale cert`; the
      # deploy script falls back to copying the internal cert so nginx always
      # finds the same two filenames.
      - ${TLS_PUBLIC_DIR:-./pki-public}:/etc/nginx/ssl/public:ro
      - ${DASHBOARD_DIST_DIR:-../../dashboard/dist}:/usr/share/nginx/html:ro
      # Agent installer + release packages downloaded by endpoints over Tailscale
      - ${AGENT_PACKAGES_DIR:-../../agent/packages}:/usr/share/nginx/html/agent:ro
    networks:
      - grid_public
    depends_on:
      grid-api:
        condition: service_healthy

networks:
  grid_internal:
    driver: bridge
    internal: true
  grid_public:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  threat_intel_packages:
