server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    # Browser-facing certificate. In production this is a real Let's Encrypt
    # chain issued by `tailscale cert <node>.<tailnet>.ts.net`, so operators get
    # a green padlock instead of a click-through warning. The deploy script
    # falls back to the internal PKI under the same filenames when Tailscale
    # HTTPS certificates are not enabled on the tailnet.
    ssl_certificate /etc/nginx/ssl/public/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/public/privkey.key;
    ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_verify_client off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; media-src 'none'; manifest-src 'self'; worker-src 'self'" always;

    location ~ ^/api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_pass http://grid-api:8000;
    }

    location ~ ^/api/v1/(dashboard|auth)/ {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_pass http://grid-api:8000;
        proxy_http_version 1.1;
    }

    # OpenAPI docs blocked in production — access via direct API port only
    location ~ ^/(docs|redoc|openapi.json) {
        return 404;
    }

    # Health check (public — also available on :443 via agent.conf)
    location = /api/v1/health {
        proxy_pass http://grid-api:8000;
        access_log off;
    }

    # ── Agent distribution ───────────────────────────────────────
    # Endpoints inside the Tailscale network fetch the installer and the agent
    # package from here (Dashboard > Agents > Add Agent prints the one-liner).
    # Only the two published artefact types are served; no directory listing.
    location ^~ /agent/ {
        # /agent/x.zip -> /usr/share/nginx/agent/x.zip (its own bind mount)
        root /usr/share/nginx;
        autoindex off;
        location ~* ^/agent/.+\.(ps1|zip|sha256)$ {
            root /usr/share/nginx;
            add_header Cache-Control "public, max-age=300" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        return 404;
    }

    # ── Dashboard React SPA ──────────────────────────────────────
    # Hashed assets (Vite content-hash filenames) — immutable cache
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # All other paths → React Router (client-side routing)
    # try_files: serve file if exists, else fallback to index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # index.html itself must NOT be cached (contains entry point hash)
        # NOTE: add_header in nested location replaces ALL parent add_header
        # directives (nginx inheritance gotcha), so security headers must be
        # repeated here.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; media-src 'none'; manifest-src 'self'; worker-src 'self'" always;
        }
    }
}
