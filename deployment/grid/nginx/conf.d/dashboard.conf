server {
    listen 8443 ssl;
    http2 on;
    server_name dashboard.grid.local;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers on;

    ssl_verify_client off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; media-src 'none'; manifest-src 'self'; worker-src 'self'" always;

    location ~ ^/api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_pass http://grid-api:8000;
    }

    location ~ ^/api/v1/(dashboard|auth)/ {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_pass http://grid-api:8000;
        proxy_http_version 1.1;
    }

    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://grid-api:8000;
    }

    # Health check (public — also available on :443 via agent.conf)
    location = /api/v1/health {
        proxy_pass http://grid-api:8000;
        access_log off;
    }

    # ── Dashboard React SPA ──────────────────────────────────────
    # Hashed assets (Vite content-hash filenames) — immutable cache
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # All other paths → React Router (client-side routing)
    # try_files: serve file if exists, else fallback to index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # index.html itself must NOT be cached (contains entry point hash)
        # NOTE: add_header in nested location replaces ALL parent add_header
        # directives (nginx inheritance gotcha), so security headers must be
        # repeated here.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; media-src 'none'; manifest-src 'self'; worker-src 'self'" always;
        }
    }
}
