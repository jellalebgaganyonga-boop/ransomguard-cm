server {
    listen 443 ssl;
    http2 on;
    server_name grid.local;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    ssl_client_certificate /etc/nginx/ssl/ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 2;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;

    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 4h;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Agent endpoints (REQUIRES mTLS)
    location ~ ^/api/v1/agents/[^/]+/(alerts|audit-logs|heartbeat|threat-intel-version) {
        if ($ssl_client_verify != SUCCESS) {
            return 401 '{"detail":"Client certificate required"}';
        }

        limit_req zone=agent_alerts burst=20 nodelay;
        limit_req_status 429;

        proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-Client-Serial $ssl_client_serial;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;

        proxy_pass http://grid-api:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Threat intel endpoints (REQUIRES mTLS)
    location ~ ^/api/v1/threat-intel/ {
        if ($ssl_client_verify != SUCCESS) {
            return 401 '{"detail":"Client certificate required"}';
        }

        client_max_body_size 100M;
        proxy_buffering off;

        proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-Client-Serial $ssl_client_serial;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://grid-api:8000;
    }

    # Enrollment (NO mTLS)
    location = /api/v1/agents/enroll {
        limit_req zone=enroll burst=5 nodelay;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://grid-api:8000;
    }

    # Health (public)
    location = /api/v1/health {
        proxy_pass http://grid-api:8000;
        access_log off;
    }
}
