# The console at http://localhost:5175, served by the GRID itself.
#
# It used to be Vite's development server, started by hand. That is a process somebody has to
# remember to start, in a terminal somebody has to leave open: close the terminal, sign out, or
# reboot, and the console is gone -- which is how a demonstration lost its console on
# 2026-10-28. This block serves the same built files nginx already serves on :8443, from the
# container that is already running, so the address works whenever the GRID is up and comes back
# by itself after a restart.
#
# Plain HTTP, and only because of where it listens: compose publishes this port on 127.0.0.1
# alone, so nothing outside this machine can reach it. The agents' channel (:443, mutual TLS)
# and the browser-facing dashboard (:8443, TLS) are untouched, and both still require the same
# sign-in, the same roles and the same tenant scope -- this is a second door into the same
# building, not a way round the lock. A machine that must be reached over a network uses :8443.
server {
    listen 5175;
    server_name localhost;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # No HSTS here: it is meaningless over HTTP and would poison the host for other ports.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; media-src 'none'; manifest-src 'self'; worker-src 'self'" always;

    # The API, on the same origin as the page: no proxy to configure, no CORS, nothing to get
    # wrong. This is what lets the console show the workstations in the VMs -- they report to
    # this same GRID over their own channel.
    location ~ ^/api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_pass http://grid-api:8000;
    }

    location ~ ^/api/v1/(dashboard|auth)/ {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_pass http://grid-api:8000;
        proxy_http_version 1.1;
    }

    location = /api/v1/health {
        proxy_pass http://grid-api:8000;
        access_log off;
    }

    # The interactive API documentation stays closed here too.
    location ~ ^/(docs|redoc|openapi.json) {
        return 404;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # add_header in a nested location replaces every inherited one, so the headers are
        # repeated rather than inherited.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; media-src 'none'; manifest-src 'self'; worker-src 'self'" always;
        }
    }
}
