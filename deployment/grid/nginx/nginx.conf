user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main_ext '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       'ssl_client_serial="$ssl_client_serial" '
                       'request_id=$request_id';

    access_log /var/log/nginx/access.log main_ext;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript text/javascript application/xml image/svg+xml;

    server_tokens off;

    limit_req_zone $binary_remote_addr zone=enroll:10m rate=10r/m;
    limit_req_zone $ssl_client_serial zone=agent_alerts:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;

    include /etc/nginx/conf.d/*.conf;
}
