# RansomGuard-CM — Continuous Integration
#
# Every component is gated independently so a failure points straight at the
# owner: GRID (FastAPI), dashboard (React) and agent (.NET 8). The `ci` job at
# the end is the single required status check to protect `main` with.
name: CI

on:
  # Every commit is pushed, so every push is tested, whatever the branch name.
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'
  DOTNET_VERSION: '8.0.x'

jobs:
  # ── GRID backend ────────────────────────────────────────────────
  grid:
    name: GRID (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: grid/requirements*.txt

      - name: Install dependencies
        # -e . matters: the package lives under grid/src, so without an install
        # `import ransomguard_grid` fails and conftest.py cannot even load.
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        # Advisory: the codebase predates mypy enforcement. Promote to a hard
        # gate once the existing findings are cleared.
        continue-on-error: true
        run: mypy src

      - name: Tests (pytest)
        run: pytest -q --cov=ransomguard_grid --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grid-coverage
          path: grid/coverage.xml
          retention-days: 7

  # ── Dashboard ───────────────────────────────────────────────────
  dashboard:
    name: Dashboard (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint (0 warnings allowed)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test

      - name: Production build
        run: npm run build

      # Consumed by the CD workflow so the deployed bundle is byte-identical to
      # the one that passed the gate -- never rebuilt on the server.
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          retention-days: 14

  # ── Dashboard end-to-end ────────────────────────────────────────
  e2e:
    name: Dashboard E2E (Playwright)
    runs-on: ubuntu-latest
    needs: dashboard
    # ~6 min, more than twice the next slowest job: run it where it gates a
    # merge (main, pull requests) or on demand, not on every push of a work
    # branch. The CI gate treats a skipped job as a pass.
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E + accessibility (WCAG 2.2 AA)
        env:
          # The GRID server lives inside the Tailscale network and is not
          # reachable from a runner. Point the dev proxy at a closed port so a
          # request that escapes the mocks fails at once instead of hanging.
          VITE_PROXY_TARGET: http://127.0.0.1:9
        run: npm run test:e2e -- --project=chromium

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: dashboard/playwright-report
          retention-days: 7

  # ── Agent ───────────────────────────────────────────────────────
  agent:
    name: Agent (.NET 8)
    # net8.0-windows targets in Service/Tests -- a Linux runner cannot build them.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore RansomGuard.Agent.sln

      - name: Build
        run: dotnet build RansomGuard.Agent.sln -c Release --no-restore

      - name: Tests
        # Stress tests are wall-clock sensitive and flake on shared runners;
        # they run in the nightly workflow instead.
        run: dotnet test RansomGuard.Agent.sln -c Release --no-build --filter "Category!=Stress" --logger "trx;LogFileName=agent-tests.trx"

      # `dotnet test` writes failures only to the job log, which needs admin
      # rights to read. Surfacing them as annotations makes a red run
      # diagnosable from the run page (and from the API) by anyone.
      - name: Report failing tests
        if: failure()
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Recurse -Filter '*.trx' -Path . -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trx) { Write-Host 'no trx file'; exit 0 }
          [xml]$doc = Get-Content $trx.FullName
          $ns = @{t='http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          $failed = Select-Xml -Xml $doc -Namespace $ns -XPath "//t:UnitTestResult[@outcome='Failed']"
          foreach ($f in $failed) {
            $name = $f.Node.testName
            $msg  = ($f.Node.Output.ErrorInfo.Message -replace "`r?`n", ' ')
            Write-Host "::error title=$name::$msg"
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-test-results
          path: agent/src/**/TestResults/*.trx
          retention-days: 7

  # ── Dependency audit ────────────────────────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: npm audit (production dependencies)
        working-directory: dashboard
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: npm audit (dev dependencies, advisory)
        working-directory: dashboard
        continue-on-error: true
        run: npm audit --audit-level=high

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: pip-audit (GRID)
        # PYSEC-2026-1325 (ecdsa): no fixed release exists upstream. ecdsa is
        # pulled in by python-jose only to support ES* JWT algorithms; this
        # deployment signs with HS256 (core/config.py: jwt_algorithm), so the
        # vulnerable code path is never reached. Re-check when a fix ships.
        #
        # CVE-2026-85394 (python-jose <= 3.5.0, alias GHSA-3qf3-8w2g-rqmx):
        # algorithm confusion, a DER public key accepted as HMAC secret. No
        # fixed release. Unreachable: the only verification key is the
        # symmetric jwt_secret_key, and every decode restricts the algorithms
        # explicitly (core/security.py:41-42, core/jwt_service.py:63,
        # core/config.py:34 HS256).
        #
        # Both ignores are temporary: python-jose is being replaced by PyJWT
        # (before R1), which removes python-jose, ecdsa and these two lines.
        # See docs/security/dependency-risk-register.md.
        run: |
          pip install pip-audit
          pip-audit -r grid/requirements.txt --strict --ignore-vuln PYSEC-2026-1325 --ignore-vuln CVE-2026-85394

  # ── Required status check ───────────────────────────────────────
  ci:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [grid, dashboard, e2e, agent, audit]
    if: always()
    steps:
      - name: Verify every job succeeded
        run: |
          echo "grid=${{ needs.grid.result }}"
          echo "dashboard=${{ needs.dashboard.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          echo "agent=${{ needs.agent.result }}"
          echo "audit=${{ needs.audit.result }}"
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
