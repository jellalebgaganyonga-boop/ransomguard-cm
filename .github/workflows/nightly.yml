# RansomGuard-CM — nightly checks.
#
# Everything that is too slow or too flaky to gate a pull request, but that must
# not silently rot: the wall-clock sensitive agent stress tests (excluded from
# CI) and a full dependency audit including development trees.
name: Nightly

on:
  schedule:
    # 02:00 UTC = 03:00 Africa/Douala -- outside working hours for the hospital.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-stress:
    name: Agent stress tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        working-directory: agent/src
        run: dotnet build RansomGuard.Agent.sln -c Release

      # These assert on timing budgets and are known to flake on shared runners;
      # a failure here is a signal to investigate, not to block a release.
      - name: Stress tests
        working-directory: agent/src
        run: dotnet test RansomGuard.Agent.sln -c Release --no-build --filter "Category=Stress" --logger "trx;LogFileName=stress.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-stress-results
          path: agent/src/**/TestResults/*.trx
          retention-days: 14

  full-audit:
    name: Full dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: npm audit (all dependencies)
        working-directory: dashboard
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pip-audit (runtime + dev)
        run: |
          pip install pip-audit
          pip-audit -r grid/requirements.txt
          pip-audit -r grid/requirements-dev.txt
